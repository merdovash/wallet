name: Redeploy project_hub

# SSH на VPS и полный редеплой через deploy-all.sh.
# DEPLOY_PATH — абсолютный путь к project_hub на сервере
# (например /root/hub/project_hub или /home/github-deploy/hub/project_hub).
#
# Secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_SSH_PASSPHRASE,
#          DEPLOY_PATH, optional DEPLOY_PORT

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-project-hub-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Redeploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          passphrase: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 45m
          script: |
            set -euo pipefail
            export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
            fi
            cd "${{ secrets.DEPLOY_PATH }}"
            chmod +x scripts/deploy-all.sh && ./scripts/deploy-all.sh

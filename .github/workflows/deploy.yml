name: Redeploy project_hub

# SSH на VPS и полный редеплой через deploy-all.sh.
# Команда выполняется из домашнего каталога пользователя на сервере.
#
# Secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_SSH_PASSPHRASE,
#          optional DEPLOY_PORT

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-project-hub-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Redeploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          passphrase: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          command_timeout: 45m
          script: |
            set -euo pipefail
            export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
            fi
            chmod +x hub/project_hub/scripts/deploy-all.sh && ./hub/project_hub/scripts/deploy-all.sh
